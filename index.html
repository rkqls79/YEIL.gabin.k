<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안내문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --bg:#f6f5f2; --ink:#17181a; --sub:#77736c; --faint:#b4afa6; --line:#e4e1da;
  --accent:#1b3a6b; --hover:#eef1f6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:0 24px}
header.wrap{padding-top:72px;padding-bottom:36px}
.eyebrow{margin:0 0 14px;font-size:12px;font-weight:500;letter-spacing:.14em;color:var(--accent)}
h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em}
.lead{margin:10px 0 0;color:var(--sub)}
main.wrap{padding-bottom:72px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);padding:0 0 10px;border-bottom:1.5px solid var(--ink)}
ol{list-style:none;margin:0;padding:0;counter-reset:n}
li{counter-increment:n;border-bottom:1px solid var(--line)}
a.item{display:flex;align-items:baseline;gap:20px;padding:22px 12px;margin:0 -12px;border-radius:10px;color:inherit;text-decoration:none;transition:background .15s}
a.item::before{content:counter(n,decimal-leading-zero);flex:none;width:22px;font-size:13px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
a.item:hover,a.item:focus-visible{background:var(--hover);outline:none}
.txt{flex:1;min-width:0}
.title{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.desc{display:block;margin-top:4px;font-size:14px;color:var(--sub)}
.arrow{flex:none;align-self:center;color:var(--faint);font-size:16px;transition:color .15s,transform .15s}
a.item:hover .arrow{color:var(--accent);transform:translateX(3px)}
a.item:hover .title{color:var(--accent)}
</style>
</head>
<body>
<header class="wrap">
  <p class="eyebrow">GUIDE</p>
  <h1>안내문</h1>
  <p class="lead">필요한 안내문을 선택해 확인하세요.</p>
</header>
<main class="wrap">
  <div class="meta"><span>전체</span><span><b id="count">1</b>건</span></div>
  <!-- 새 안내문을 추가하려면 아래 <li> 블록을 복사해 href·제목·설명만 바꾸세요. -->
  <ol id="list">
    <li>
      <a class="item" href="은행별_빠른조회_등록안내.html">
        <span class="txt">
          <span class="title">은행별 빠른조회 등록안내</span>
          <span class="desc">계좌 내역 자동 조회를 위해 은행별 빠른조회를 신청하는 방법</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
  </ol>
</main>
<script>document.getElementById('count').textContent=document.querySelectorAll('#list > li').length;</script>
</body>
</html>
