<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서 목록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --bg:#f5f6f8; --card:#fff; --ink:#1d2433; --sub:#5b6475; --line:#e3e6ec;
  --accent:#2f5bea; --accent-soft:#eaf0ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:32px 0 22px}
h1{margin:0 0 4px;font-size:24px}
.lead{margin:0;color:var(--sub)}
main{padding:20px 0 40px}
.count{font-size:13px;color:var(--sub);margin:0 0 10px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:n}
li{counter-increment:n}
a.item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s}
a.item::before{content:counter(n,decimal-leading-zero);flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700}
a.item:hover,a.item:focus-visible{border-color:var(--accent);box-shadow:0 2px 10px rgba(47,91,234,.10);outline:none}
.txt{flex:1;min-width:0}
.title{display:block;font-size:16px;font-weight:700}
.desc{display:block;margin-top:2px;font-size:13.5px;color:var(--sub)}
.arrow{flex:none;color:var(--off,#c3c8d2);font-size:18px;transition:color .15s,transform .15s}
a.item:hover .arrow{color:var(--accent);transform:translateX(2px)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>문서 목록</h1>
    <p class="lead">안내 문서를 골라 열어보세요.</p>
  </div>
</header>
<main class="wrap">
  <p class="count">총 <b id="count">1</b>건</p>
  <!-- 새 문서를 추가하려면 아래 <li> 블록을 복사해 href·제목·설명만 바꾸세요. -->
  <ol id="list">
    <li>
      <a class="item" href="은행별_빠른조회_등록안내.html">
        <span class="txt">
          <span class="title">은행별 빠른조회 등록안내</span>
          <span class="desc">계좌 내역 자동 조회를 위해 은행별 빠른조회를 신청하는 방법</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
  </ol>
</main>
<script>document.getElementById('count').textContent=document.querySelectorAll('#list > li').length;</script>
</body>
</html>
